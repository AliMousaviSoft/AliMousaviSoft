name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          user: AliMousaviSoft
          token: ${{ secrets.METRICS_TOKEN }}

          template: classic
          base: header, activity, repositories, metadata

          config_timezone: America/New_York

          # ─────────────────────────────
          # CORE IDENTITY (stable + meaningful)
          # ─────────────────────────────
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage

          # ─────────────────────────────
          # ACHIEVEMENTS (stable mode only)
          # ─────────────────────────────
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 6

          # ─────────────────────────────
          # TOPICS (clean signal)
          # ─────────────────────────────
          plugin_topics: yes
          plugin_topics_limit: 6

          # ─────────────────────────────
          # STARS (reduced noise)
          # ─────────────────────────────
          plugin_stars: yes
          plugin_stars_limit: 3

          # ─────────────────────────────
          # REPOSITORIES (your real signal)
          # ─────────────────────────────
          plugin_repositories: yes
          plugin_repositories_featured: AliMousaviSoft/sondra,AliMousaviSoft/subjackal,AliMousaviSoft/Hunt-kit
          # ─────────────────────────────
          # ACTIVITY (safe mode)
          # ─────────────────────────────
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14

          # ─────────────────────────────
          # CODE METRICS
          # ─────────────────────────────
          plugin_lines: yes

          # ─────────────────────────────
          # CLEAN OUTPUT (IMPORTANT)
          # ─────────────────────────────
          plugin_errors: hide
